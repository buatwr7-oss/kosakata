    <meta charset="UTF-8">

    <title>Hafalan JFT SSW</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
        
        * { box-sizing: border-box; font-family: 'Nunito', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: #293241;
            background-image: radial-gradient(#3d5a80 2px, transparent 2px);
            background-size: 20px 20px;
            margin: 0; padding: 15px; 
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden; color: #fff;
        }

        .header { width: 100%; text-align: center; margin-bottom: 15px; }
        
        h2 { 
            margin: 5px 0 15px 0; color: #ee6c4d; 
            text-shadow: 2px 2px 0px #000; font-size: 24px; 
            text-transform: uppercase; letter-spacing: 2px;
            -webkit-text-stroke: 1px #000;
        }

        select { 
            width: 100%; padding: 12px 15px; font-size: 16px; font-weight: 900;
            border: 3px solid #000; border-radius: 12px; 
            background: #e0fbfc; color: #000;
            box-shadow: 4px 4px 0px #000; outline: none; 
            appearance: none; text-align: center;
        }

        .card-container { 
            perspective: 1000px; width: 100%; flex-grow: 1; 
            cursor: pointer; margin-bottom: 20px;
        }

        .card { 
            width: 100%; height: 100%; position: relative; 
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            transform-style: preserve-3d; 
        }

        .card.flipped { transform: rotateY(180deg) scale(0.95); }

        .face { 
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            font-size: 36px; border-radius: 20px; border: 4px solid #000; 
            box-shadow: 6px 6px 0px #000; padding: 20px; text-align: center;
        }

        .front { background: #98c1d9; color: #000; }
        .back { background: #ee6c4d; color: #fff; transform: rotateY(180deg); }

        .label { 
            font-size: 12px; font-weight: 900; background: #000; color: #fff; 
            padding: 5px 15px; border-radius: 20px; margin-bottom: 20px; 
            text-transform: uppercase; letter-spacing: 1.5px;
        }

        .controls { display: flex; gap: 12px; width: 100%; }
        
        button { 
            flex: 1; padding: 18px 10px; font-size: 16px; font-weight: 900; 
            border: 3px solid #000; border-radius: 12px; cursor: pointer; 
            background: #e0fbfc; color: #000; text-transform: uppercase;
            box-shadow: 4px 4px 0px #000; transition: all 0.1s;
        }

        .btn-acak { background: #ffd166; flex: 0.8; }
        
        button:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #000; }

        .progress { 
            margin-top: 20px; margin-bottom: 10px; font-size: 16px; font-weight: 900; 
            color: #e0fbfc; background: #000; padding: 6px 20px; 
            border-radius: 20px; border: 2px solid #3d5a80;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🔥 Hafalan JFT 🔥</h2>
        <select id="chapterSelect" onchange="changeChapter()"></select>
    </div>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="flashcard">
            <div class="face front">
                <span class="label">日本語</span>
                <span id="wordJpn">Memuat...</span>
            </div>
            <div class="face back">
                <span class="label">B. Indonesia</span>
                <span id="wordIndo">...</span>
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="prevCard()">&#9664; Prev</button>
        <button class="btn-acak" onclick="shuffleCards()">Acak</button>
        <button onclick="nextCard()">Next &#9654;</button>
    </div>
    
    <div class="progress" id="progressText">0 / 0</div>

        let flashcards = {};
        let currentChapterData = [];
        let currentIndex = 0;

        function parseRawData(text) {
            const data = {};
            let currentBab = "";
            const lines = text.split('\n');
            
            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('**Bab')) {
                    currentBab = line.replace(/\*/g, '').trim();
                    data[currentBab] = [];
                } else if ((line.startsWith('- ') || line.startsWith('* ')) && currentBab) {
                    let parts = line.substring(2).split(':');
                    if (parts.length >= 2) {
                        let indo = parts[0].trim();
                        let jpn = parts.slice(1).join(':').trim();
                        jpn = jpn.replace(/\\/g, '').trim();
                        data[currentBab].push({ indo, jpn });
                    }
                }
            });
            return data;
        }

        function init() {
            flashcards = parseRawData(rawData);
            const select = document.getElementById('chapterSelect');
            
            for (const bab in flashcards) {
                if(flashcards[bab].length > 0) {
                    const option = document.createElement('option');
                    option.value = bab;
                    option.textContent = bab + " (" + flashcards[bab].length + " Kata)";
                    select.appendChild(option);
                }
            }
            if (Object.keys(flashcards).length > 0) changeChapter();
        }

        function changeChapter() {
            const chapter = document.getElementById('chapterSelect').value;
            if (!chapter || !flashcards[chapter]) return;
            
            currentChapterData = [...flashcards[chapter]];
            shuffleArray(currentChapterData);
            
            currentIndex = 0;
            document.getElementById('flashcard').classList.remove('flipped');
            updateCardDisplay();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function shuffleCards() {
            document.getElementById('flashcard').classList.remove('flipped');
            setTimeout(() => {
                shuffleArray(currentChapterData);
                currentIndex = 0;
                updateCardDisplay();
            }, 250);
        }

        function updateCardDisplay() {
            if (currentChapterData.length === 0) return;
            
            const textIndo = currentChapterData[currentIndex].indo;
            const textJpn = currentChapterData[currentIndex].jpn;
            
            document.getElementById('wordIndo').style.fontSize = textIndo.length > 20 ? '24px' : '36px';
            document.getElementById('wordJpn').style.fontSize = textJpn.length > 15 ? '28px' : '40px';
            
            document.getElementById('wordIndo').textContent = textIndo;
            document.getElementById('wordJpn').textContent = textJpn;
            document.getElementById('progressText').textContent = (currentIndex + 1) + " / " + currentChapterData.length;
        }

        function flipCard() {
            document.getElementById('flashcard').classList.toggle('flipped');
        }

        function nextCard() {
            document.getElementById('flashcard').classList.remove('flipped');
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % currentChapterData.length;
                updateCardDisplay();
            }, 250);
        }

        function prevCard() {
            document.getElementById('flashcard').classList.remove('flipped');
            setTimeout(() => {
                currentIndex = (currentIndex - 1 + currentChapterData.length) % currentChapterData.length;
                updateCardDisplay();
            }, 250);
        }

        init();
    </script>
