    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Hafalan JFT">

    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <style>
        :root {
            --navy: #293241; --dot: #3d5a80; --coral: #ee6c4d; --sky: #98c1d9;
            --ice: #e0fbfc; --sun: #ffd166; --ok: #06d6a0; --bad: #ef476f;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; height: 100%; }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
            font-weight: 800;
            background-color: var(--navy);
            background-image: radial-gradient(var(--dot) 2px, transparent 2px);
            background-size: 20px 20px;
            color: #fff;
            height: 100vh; height: 100dvh; overflow: hidden;
            padding: calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
            display: flex; justify-content: center;
        }
        button, select { font: inherit; font-weight: 900; touch-action: manipulation; }

        .app {
            width: 100%; max-width: 520px; height: 100%; min-height: 0;
            display: flex; flex-direction: column; gap: 10px;
            user-select: none; -webkit-user-select: none;
        }

        /* ---------- Header ---------- */
        .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        h1 {
            margin: 0; font-size: 22px; color: var(--coral);
            text-transform: uppercase; letter-spacing: 1.5px;
            text-shadow: 2px 2px 0 #000; -webkit-text-stroke: 1px #000;
        }
        .install {
            display: none; padding: 7px 12px; font-size: 13px; cursor: pointer;
            border: 3px solid #000; border-radius: 12px; background: var(--sun); color: #000;
            box-shadow: 3px 3px 0 #000;
        }
        .install:active { transform: translate(3px, 3px); box-shadow: none; }

        select {
            width: 100%; padding: 12px 15px; font-size: 16px;
            border: 3px solid #000; border-radius: 12px;
            background: var(--ice); color: #000;
            box-shadow: 4px 4px 0 #000; outline: none;
            appearance: none; -webkit-appearance: none;
            text-align: center; text-align-last: center;
        }

        .row { display: flex; gap: 8px; }
        .chip {
            flex: 1; padding: 9px 6px; font-size: 13px; cursor: pointer;
            border: 3px solid #000; border-radius: 12px;
            background: var(--ice); color: #000; box-shadow: 3px 3px 0 #000;
            transition: transform .08s, box-shadow .08s, background .15s;
            white-space: nowrap;
        }
        .chip:active { transform: translate(3px, 3px); box-shadow: none; }
        .chip.on { background: var(--sun); }
        .tabs .chip { font-size: 15px; padding: 10px 6px; }
        .tabs .chip.on { background: var(--coral); color: #fff; }

        .stats { display: flex; align-items: center; gap: 10px; font-size: 13px; }
        .bar { flex: 1; height: 16px; border: 3px solid #000; border-radius: 99px; background: #000; overflow: hidden; }
        .bar > i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }
        #statText { white-space: nowrap; color: var(--ice); }
        .reset {
            border: 2px solid var(--dot); background: #000; color: var(--ice);
            border-radius: 99px; padding: 3px 10px; font-size: 12px; cursor: pointer;
        }

        /* ---------- Kartu ---------- */
        .stage { flex: 1; min-height: 0; display: flex; }
        .card-container {
            perspective: 1000px; width: 100%; height: 100%; cursor: pointer;
            transition: transform .19s ease-in, opacity .19s ease-in;
        }
        .card-container.out-right { transform: translateX(110%) rotate(10deg); opacity: 0; }
        .card-container.out-left  { transform: translateX(-110%) rotate(-10deg); opacity: 0; }
        .card-container.pop { animation: pop .2s ease-out; }
        @keyframes pop { from { transform: scale(.94); opacity: .5; } to { transform: scale(1); opacity: 1; } }

        .card {
            width: 100%; height: 100%; position: relative;
            transition: transform .6s cubic-bezier(.175, .885, .32, 1.275);
            transform-style: preserve-3d;
        }
        .card.flipped { transform: rotateY(180deg) scale(.95); }

        .face {
            position: absolute; inset: 0;
            backface-visibility: hidden; -webkit-backface-visibility: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 20px; border: 4px solid #000; box-shadow: 6px 6px 0 #000;
            padding: 20px; text-align: center;
        }
        .front { background: var(--sky); color: #000; }
        .back { background: var(--coral); color: #fff; transform: rotateY(180deg); }

        .label {
            font-size: 12px; font-weight: 900; background: #000; color: #fff;
            padding: 5px 15px; border-radius: 20px; margin-bottom: 20px;
            text-transform: uppercase; letter-spacing: 1.5px;
        }
        .word { line-height: 1.25; word-break: break-word; font-weight: 900; }
        .sub { margin-top: 10px; font-size: 16px; opacity: .8; }

        .badge {
            position: absolute; top: 12px; right: 12px; display: none;
            background: #000; color: var(--ok); font-size: 12px;
            padding: 4px 10px; border-radius: 99px;
        }
        .known .badge { display: block; }
        .hint { position: absolute; bottom: 12px; left: 0; right: 0; font-size: 11px; opacity: .55; font-weight: 800; }

        /* ---------- Tombol aksi ---------- */
        .actions, .nav { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
        .btn {
            padding: 16px 8px; font-size: 16px; cursor: pointer; color: #000;
            border: 3px solid #000; border-radius: 14px; background: var(--ice);
            box-shadow: 4px 4px 0 #000; transition: transform .08s, box-shadow .08s;
        }
        .btn:active { transform: translate(4px, 4px); box-shadow: none; }
        .btn.no { background: var(--bad); color: #fff; }
        .btn.yes { background: var(--ok); }
        .btn.sound { background: var(--sun); padding: 16px 20px; }
        .btn.nav-b { padding: 13px 8px; }
        .counter {
            background: #000; border: 2px solid var(--dot); border-radius: 99px;
            padding: 6px 16px; font-size: 15px; min-width: 100px; text-align: center; color: var(--ice);
        }

        /* ---------- Kuis ---------- */
        .quiz { display: none; flex: 1; min-height: 0; flex-direction: column; gap: 10px; }
        .q-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--ice); }
        .q-card {
            flex: 1; min-height: 110px; position: relative;
            background: var(--sky); color: #000;
            border: 4px solid #000; border-radius: 20px; box-shadow: 6px 6px 0 #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 16px; text-align: center;
        }
        .mini {
            position: absolute; right: 10px; bottom: 10px; width: 44px; height: 44px;
            display: none; align-items: center; justify-content: center; font-size: 20px; cursor: pointer;
            border: 3px solid #000; border-radius: 50%; background: var(--sun);
        }
        .opts { display: grid; gap: 10px; }
        .opt {
            padding: 14px 12px; font-size: 17px; cursor: pointer; color: #000;
            border: 3px solid #000; border-radius: 14px; background: var(--ice);
            box-shadow: 4px 4px 0 #000; text-align: center; word-break: break-word;
            transition: background .12s;
        }
        .opt.jp { font-size: 22px; }
        .opt:active { transform: translate(4px, 4px); box-shadow: none; }
        .opt.right { background: var(--ok); }
        .opt.wrong { background: var(--bad); color: #fff; }

        .quizmode .stage, .quizmode .actions, .quizmode .nav { display: none; }
        .quizmode .quiz { display: flex; }

        .toast {
            position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
            transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
            background: #000; color: #fff; border: 2px solid var(--sun);
            padding: 10px 18px; border-radius: 99px; font-size: 14px; max-width: 90vw; text-align: center;
            transition: opacity .2s, transform .2s;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-height: 640px) {
            .app { gap: 7px; }
            h1 { font-size: 19px; }
            .btn { padding: 12px 8px; }
            .btn.sound { padding: 12px 18px; }
            .opt { padding: 11px 10px; }
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="top">
        <h1>🔥 Hafalan Kosakata</h1>
        <button class="install" id="installBtn">📲 Instal</button>
    </div>

    <select id="chapterSelect" aria-label="Pilih bab"></select>

    <div class="row tabs">
        <button class="chip" id="tabCard">🃏 Kartu</button>
        <button class="chip" id="tabQuiz">📝 Kuis</button>
    </div>
    <div class="row">
        <button class="chip" id="dirBtn"></button>
        <button class="chip" id="shuffleBtn"></button>
        <button class="chip" id="unknownBtn">🎯 Belum hafal</button>
    </div>

    <div class="stats">
        <div class="bar"><i id="barFill"></i></div>
        <span id="statText"></span>
        <button class="reset" id="resetBtn" aria-label="Reset progres">↺ Reset</button>
    </div>

    <!-- Mode kartu -->
    <div class="stage">
        <div class="card-container" id="cc">
            <div class="card" id="card">
                <div class="face front">
                    <span class="badge">✓ Hafal</span>
                    <span class="label" id="fLabel"></span>
                    <span class="word" id="fWord">Memuat...</span>
                    <span class="hint">ketuk = balik · geser kanan = hafal · geser kiri = belum</span>
                </div>
                <div class="face back">
                    <span class="badge">✓ Hafal</span>
                    <span class="label" id="bLabel"></span>
                    <span class="word" id="bWord"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="actions" id="actions">
        <button class="btn no" id="noBtn">✗ Belum</button>
        <button class="btn sound" id="soundBtn" aria-label="Putar suara">🔊</button>
        <button class="btn yes" id="yesBtn">✓ Hafal</button>
    </div>
    <div class="nav" id="nav">
        <button class="btn nav-b" id="prevBtn">&#9664; Prev</button>
        <div class="counter" id="progressText">0 / 0</div>
        <button class="btn nav-b" id="nextBtn">Next &#9654;</button>
    </div>

    <!-- Mode kuis -->
    <div class="quiz" id="quiz">
        <div class="q-meta"><span id="qProgress"></span><span id="qScore"></span></div>
        <div class="q-card">
            <span class="label" id="qLabel"></span>
            <span class="word" id="qWord"></span>
            <span class="sub" id="qSub"></span>
            <button class="mini" id="qSpeak" aria-label="Putar suara">🔊</button>
        </div>
        <div class="opts" id="opts"></div>
    </div>
</div>
<div class="toast" id="toast"></div>

/* ================= Data ================= */
function parseRawData(text) {
    const words = [], order = [];
    let bab = '';
    text.split('\n').forEach(line => {
        line = line.trim();
        if (line.startsWith('**Bab')) {
            bab = line.replace(/\*/g, '').trim();
            order.push(bab);
        } else if ((line.startsWith('- ') || line.startsWith('* ')) && bab) {
            const rest = line.substring(2);
            const p = rest.indexOf(':');
            if (p > 0) {
                const indo = rest.slice(0, p).trim();
                const jpn = rest.slice(p + 1).replace(/\\/g, '').trim();
                if (indo && jpn) words.push({ bab, indo, jpn, key: bab + '|' + indo + '|' + jpn });
            }
        }
    });
    return { words, order };
}

const parsed = parseRawData(rawData);
const words = parsed.words;
const order = parsed.order.filter(b => words.some(w => w.bab === b));
const byBab = {};
words.forEach(w => (byBab[w.bab] = byBab[w.bab] || []).push(w));

/* ================= Penyimpanan ================= */
const PKEY = 'jft_progress_v1', SKEY = 'jft_settings_v1';
function loadJSON(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

let known = loadJSON(PKEY) || {};
const defaults = { chapter: order[0], dir: 'jp2id', mode: 'card', onlyUnknown: false, shuffle: true };
let state = Object.assign({}, defaults, loadJSON(SKEY) || {});
if (state.chapter !== 'ALL' && !byBab[state.chapter]) state.chapter = order[0];
if (state.mode !== 'quiz') state.mode = 'card';
if (state.dir !== 'id2jp') state.dir = 'jp2id';

const isKnown = w => !!known[w.key];
function setKnown(w, v) {
    if (v) known[w.key] = 1; else delete known[w.key];
    saveJSON(PKEY, known);
}
const saveState = () => saveJSON(SKEY, state);

/* ================= Util ================= */
const $ = id => document.getElementById(id);
const el = {
    app: $('app'), select: $('chapterSelect'), cc: $('cc'), card: $('card'),
    fLabel: $('fLabel'), fWord: $('fWord'), bLabel: $('bLabel'), bWord: $('bWord'),
    progress: $('progressText'), barFill: $('barFill'), statText: $('statText'),
    qProgress: $('qProgress'), qScore: $('qScore'), qLabel: $('qLabel'),
    qWord: $('qWord'), qSub: $('qSub'), qSpeak: $('qSpeak'), opts: $('opts'), toast: $('toast')
};

function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function sizeFor(text, isJp) {
    const n = [...text].length;
    if (isJp) return n <= 5 ? 52 : n <= 8 ? 44 : n <= 12 ? 36 : n <= 18 ? 28 : 22;
    return n <= 8 ? 42 : n <= 14 ? 34 : n <= 22 ? 28 : n <= 34 ? 24 : 20;
}
function setWord(node, text, isJp) {
    node.textContent = text;
    node.lang = isJp ? 'ja' : 'id';
    node.style.fontSize = sizeFor(text, isJp) + 'px';
}

let toastTimer;
function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2400);
}

/* ================= Suara ================= */
function cleanJp(t) {
    return t.split(' / ')[0].replace(/\(.*?\)/g, '').replace(/[～~]/g, '').trim();
}
function speak(text) {
    if (!('speechSynthesis' in window)) { toast('Perangkat ini belum mendukung suara'); return; }
    const voices = speechSynthesis.getVoices();
    const ja = voices.find(v => v.lang && v.lang.toLowerCase().replace('_', '-').startsWith('ja'));
    if (voices.length && !ja) toast('Suara Jepang belum terpasang di HP (cek pengaturan Text-to-speech)');
    const u = new SpeechSynthesisUtterance(cleanJp(text));
    u.lang = 'ja-JP'; u.rate = 0.85;
    if (ja) u.voice = ja;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
}
if ('speechSynthesis' in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; }

/* ================= Deck & statistik ================= */
let deck = [], idx = 0, animating = false;

function scopeWords() {
    return state.chapter === 'ALL' ? words : (byBab[state.chapter] || []);
}
function scopeName() {
    return state.chapter === 'ALL' ? 'semua bab' : state.chapter;
}

function buildChapterSelect() {
    el.select.innerHTML = '';
    const all = document.createElement('option');
    all.value = 'ALL';
    el.select.appendChild(all);
    order.forEach(b => {
        const o = document.createElement('option');
        o.value = b;
        el.select.appendChild(o);
    });
    refreshChapterLabels();
    el.select.value = state.chapter;
}
function refreshChapterLabels() {
    [...el.select.options].forEach(o => {
        const list = o.value === 'ALL' ? words : byBab[o.value];
        const k = list.filter(isKnown).length;
        o.textContent = (o.value === 'ALL' ? '📚 Semua Bab' : o.value) + '  ·  ' + k + '/' + list.length;
    });
}

function updateStats() {
    const sc = scopeWords();
    const k = sc.filter(isKnown).length;
    el.barFill.style.width = (sc.length ? (k / sc.length) * 100 : 0) + '%';
    $('statText').textContent = k + '/' + sc.length + ' hafal';
    refreshChapterLabels();
}

function buildDeck() {
    let list = scopeWords();
    if (state.onlyUnknown) list = list.filter(w => !isKnown(w));
    deck = state.shuffle ? shuffled(list) : list.slice();
    idx = 0;
}

/* ================= Mode kartu ================= */
function renderCard() {
    const w = deck[idx];
    const jp2id = state.dir === 'jp2id';
    el.cc.classList.toggle('known', !!w && isKnown(w));

    if (!w) {
        el.fLabel.textContent = 'Selesai'; el.bLabel.textContent = 'Selesai';
        const msg = state.onlyUnknown
            ? '🎉 Semua kata di sini sudah hafal! Matikan "Belum hafal" untuk mengulang.'
            : 'Tidak ada kata di bab ini.';
        setWord(el.fWord, msg, false); setWord(el.bWord, msg, false);
        el.fWord.style.fontSize = el.bWord.style.fontSize = '22px';
        el.progress.textContent = '0 / 0';
        return;
    }
    el.fLabel.textContent = jp2id ? '日本語' : 'B. Indonesia';
    el.bLabel.textContent = jp2id ? 'B. Indonesia' : '日本語';
    setWord(el.fWord, jp2id ? w.jpn : w.indo, jp2id);
    setWord(el.bWord, jp2id ? w.indo : w.jpn, !jp2id);
    el.progress.textContent = (idx + 1) + ' / ' + deck.length;
}

function swap(dir, change) {
    if (animating) return;
    animating = true;
    el.cc.classList.add(dir);
    setTimeout(() => {
        el.card.style.transition = 'none';
        el.card.classList.remove('flipped');
        el.cc.style.transition = 'none';
        el.cc.classList.remove(dir);
        change();
        renderCard();
        void el.cc.offsetWidth;
        el.card.style.transition = '';
        el.cc.style.transition = '';
        el.cc.classList.add('pop');
        setTimeout(() => el.cc.classList.remove('pop'), 220);
        animating = false;
    }, 190);
}

function flipCard() {
    if (!deck.length || animating) return;
    el.card.classList.toggle('flipped');
}
function nextCard() {
    if (!deck.length) return;
    swap('out-left', () => { idx = (idx + 1) % deck.length; });
}
function prevCard() {
    if (!deck.length) return;
    swap('out-right', () => { idx = (idx - 1 + deck.length) % deck.length; });
}
function markCard(isHafal) {
    const w = deck[idx];
    if (!w || animating) return;
    setKnown(w, isHafal);
    updateStats();
    swap(isHafal ? 'out-right' : 'out-left', () => {
        if (state.onlyUnknown && isHafal) {
            deck.splice(idx, 1);
            if (idx >= deck.length) idx = 0;
        } else {
            idx = (idx + 1) % deck.length;
        }
    });
}
function speakCurrent() {
    const w = deck[idx];
    if (w) speak(w.jpn);
}

/* Geser kartu */
let tx = 0, ty = 0, swiped = false;
el.cc.addEventListener('touchstart', e => {
    const t = e.changedTouches[0];
    tx = t.clientX; ty = t.clientY; swiped = false;
}, { passive: true });
el.cc.addEventListener('touchend', e => {
    const t = e.changedTouches[0];
    const dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        swiped = true;
        markCard(dx > 0);
    }
}, { passive: true });
el.cc.addEventListener('click', () => {
    if (swiped) { swiped = false; return; }
    flipCard();
});

/* ================= Mode kuis ================= */
const quiz = { queue: [], total: 0, correct: 0, wrong: 0, current: null, locked: false, timer: null };

function makeOptions(w) {
    const jp2id = state.dir === 'jp2id';
    const correctText = jp2id ? w.indo : w.jpn;
    const seen = new Set([correctText]);
    const opts = [];
    for (const x of shuffled(words)) {
        if (opts.length >= 3) break;
        const t = jp2id ? x.indo : x.jpn;
        if (seen.has(t)) continue;
        if (jp2id && x.jpn === w.jpn) continue;   // bacaan sama = jawaban ambigu
        if (!jp2id && x.indo === w.indo) continue;
        seen.add(t);
        opts.push({ text: t, correct: false });
    }
    opts.push({ text: correctText, correct: true });
    return shuffled(opts);
}

function startQuiz() {
    clearTimeout(quiz.timer);
    let list = scopeWords();
    if (state.onlyUnknown) list = list.filter(w => !isKnown(w));
    quiz.queue = shuffled(list);
    quiz.total = quiz.queue.length;
    quiz.correct = 0; quiz.wrong = 0; quiz.current = null; quiz.locked = false;
    nextQuestion();
}

function updateQuizScore() {
    el.qScore.textContent = '✅ ' + quiz.correct + '   ❌ ' + quiz.wrong;
}

function nextQuestion() {
    if (state.mode !== 'quiz') return;
    quiz.locked = false;
    updateQuizScore();
    if (!quiz.queue.length) { showResult(); return; }

    const w = quiz.queue.pop();
    const jp2id = state.dir === 'jp2id';
    quiz.current = { word: w, options: makeOptions(w) };

    el.qLabel.textContent = jp2id ? '日本語' : 'B. Indonesia';
    setWord(el.qWord, jp2id ? w.jpn : w.indo, jp2id);
    el.qSub.textContent = '';
    el.qSpeak.style.display = jp2id ? 'flex' : 'none';
    el.qProgress.textContent = 'Soal ' + (quiz.correct + quiz.wrong + 1) + ' / ' + quiz.total;

    el.opts.innerHTML = '';
    quiz.current.options.forEach((o, i) => {
        const b = document.createElement('button');
        b.className = 'opt' + (jp2id ? '' : ' jp');
        b.lang = jp2id ? 'id' : 'ja';
        b.textContent = o.text;
        b.addEventListener('click', () => answerQuiz(i));
        el.opts.appendChild(b);
    });
}

function answerQuiz(i) {
    if (quiz.locked || !quiz.current) return;
    quiz.locked = true;
    const { word, options } = quiz.current;
    const btns = [...el.opts.children];
    options.forEach((o, k) => { if (o.correct) btns[k].classList.add('right'); });
    if (options[i].correct) {
        quiz.correct++; setKnown(word, true);
    } else {
        btns[i].classList.add('wrong'); quiz.wrong++; setKnown(word, false);
    }
    updateStats();
    updateQuizScore();
    quiz.timer = setTimeout(nextQuestion, options[i].correct ? 650 : 1700);
}

function showResult() {
    el.qSpeak.style.display = 'none';
    el.opts.innerHTML = '';
    const done = quiz.correct + quiz.wrong;
    if (!done) {
        el.qLabel.textContent = 'Kuis';
        setWord(el.qWord, state.onlyUnknown ? '🎉 Semua sudah hafal!' : 'Belum ada kata.', false);
        el.qWord.style.fontSize = '26px';
        el.qSub.textContent = '';
        el.qProgress.textContent = '';
    } else {
        const pct = Math.round((quiz.correct / done) * 100);
        el.qLabel.textContent = 'Hasil kuis';
        setWord(el.qWord, pct + '%', false);
        el.qWord.style.fontSize = '60px';
        el.qSub.textContent = 'Benar ' + quiz.correct + ' dari ' + done + ' soal';
        el.qProgress.textContent = 'Selesai';
    }
    const again = document.createElement('button');
    again.className = 'opt'; again.textContent = '🔁 Ulangi kuis';
    again.addEventListener('click', startQuiz);
    const back = document.createElement('button');
    back.className = 'opt'; back.textContent = '🃏 Kembali ke kartu';
    back.addEventListener('click', () => { state.mode = 'card'; applySettings(); });
    el.opts.append(again, back);
}

    $('tabCard').classList.toggle('on', state.mode === 'card');
    $('tabQuiz').classList.toggle('on', state.mode === 'quiz');
    $('dirBtn').textContent = state.dir === 'jp2id' ? '日本語 → ID' : 'ID → 日本語';
    $('shuffleBtn').textContent = state.shuffle ? '🔀 Acak' : '↕ Urut';

    $('unknownBtn').classList.toggle('on', state.onlyUnknown);
    el.app.classList.toggle('quizmode', state.mode === 'quiz');
}

function applySettings() {
    saveState();
    updateChips();
    el.select.value = state.chapter;
    updateStats();
    buildDeck();
    el.card.classList.remove('flipped');
    if (state.mode === 'quiz') startQuiz(); else renderCard();
}

$('tabCard').addEventListener('click', () => { state.mode = 'card'; applySettings(); });
$('tabQuiz').addEventListener('click', () => { state.mode = 'quiz'; applySettings(); });

    if (!confirm('Reset progres hafalan untuk ' + scopeName() + '?')) return;
    scopeWords().forEach(w => delete known[w.key]);
    saveJSON(PKEY, known);
    applySettings();
    toast('Progres ' + scopeName() + ' direset');
});

document.addEventListener('keydown', e => {
    if (state.mode !== 'card') return;
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'SELECT') return;
    if (e.key === 'ArrowRight') nextCard();
    else if (e.key === 'ArrowLeft') prevCard();
    else if (e.key === ' ' || e.key === 'Enter') { if (tag !== 'BUTTON') { e.preventDefault(); flipCard(); } }
    else if (e.key === 'h') markCard(true);
    else if (e.key === 'b') markCard(false);
    else if (e.key === 's') speakCurrent();
});

/* ================= PWA ================= */
let deferredPrompt = null;
const installBtn = $('installBtn');
const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    if (!standalone) installBtn.style.display = 'block';
});
installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.style.display = 'none';
});
window.addEventListener('appinstalled', () => { installBtn.style.display = 'none'; toast('Aplikasi terpasang 🎉'); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ================= Mulai ================= */
buildChapterSelect();
applySettings();
</script>
